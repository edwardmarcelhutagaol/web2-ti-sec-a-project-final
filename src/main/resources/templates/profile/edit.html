<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::.content})}">
<head>
    <title>Edit Profile - Inventory Pro</title>
</head>
<body>
    <div class="content">
        <div class="max-w-4xl mx-auto">
            <div class="flex items-center gap-4 mb-8">
                <a th:href="@{/profile}" class="flex items-center justify-center w-12 h-12 bg-white border border-slate-200 rounded-2xl text-slate-500 hover:text-primary-600 hover:border-primary-200 transition-all shadow-sm">
                    <i class="bi bi-arrow-left text-xl"></i>
                </a>
                <div>
                    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Edit Profile</h1>
                    <p class="text-slate-500">Perbarui informasi personal dan profil publik Anda.</p>
                </div>
            </div>

            <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 overflow-hidden">
                <form th:action="@{/profile/update}" method="post" class="divide-y divide-slate-100">
                    <input type="hidden" name="id" th:value="${user.id}">
                    
                    <!-- Basic Info Section -->
                    <div class="p-8 md:p-10">
                        <h5 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                            <span class="w-1.5 h-6 bg-primary-600 rounded-full"></span>
                            Basic Information
                        </h5>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Username</label>
                                <div class="relative">
                                    <i class="bi bi-at absolute left-5 top-1/2 -translate-y-1/2 text-slate-300"></i>
                                    <input type="text" th:value="${user.username}" class="w-full pl-12 pr-5 py-4 bg-slate-50 border border-slate-100 rounded-2xl text-slate-400 cursor-not-allowed outline-none" readonly disabled>
                                </div>
                                <p class="mt-2 text-[10px] text-slate-400 font-medium ml-1 italic">Username tidak dapat diubah.</p>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Full Name</label>
                                <div class="relative group">
                                    <i class="bi bi-person absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary-600 transition-colors"></i>
                                    <input type="text" name="fullName" th:value="${user.fullName}" class="w-full pl-12 pr-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all outline-none" placeholder="Nama lengkap Anda">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Email Address</label>
                                <div class="relative group">
                                    <i class="bi bi-envelope absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary-600 transition-colors"></i>
                                    <input type="email" name="email" th:value="${user.email}" class="w-full pl-12 pr-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all outline-none" placeholder="example@domain.com">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Phone Number</label>
                                <div class="relative group">
                                    <i class="bi bi-phone absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary-600 transition-colors"></i>
                                    <input type="text" name="phoneNumber" th:value="${user.phoneNumber}" class="w-full pl-12 pr-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all outline-none" placeholder="+62...">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Profile Media Section -->
                    <div class="p-8 md:p-10">
                        <h5 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                            <span class="w-1.5 h-6 bg-primary-600 rounded-full"></span>
                            Profile Media
                        </h5>
                        <div>
                            <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Profile Image URL</label>
                            <div class="relative group">
                                <i class="bi bi-image absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary-600 transition-colors"></i>
                                <input type="url" name="profileImageUrl" th:value="${user.profileImageUrl}" class="w-full pl-12 pr-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all outline-none" placeholder="https://example.com/image.jpg">
                            </div>
                            <p class="mt-2 text-[11px] text-slate-400 font-medium ml-1">Gunakan link langsung ke file gambar (JPEG, PNG).</p>
                        </div>
                    </div>

                    <!-- Bio & Address Section -->
                    <div class="p-8 md:p-10">
                        <h5 class="text-lg font-bold text-slate-900 mb-6 flex items-center gap-2">
                            <span class="w-1.5 h-6 bg-primary-600 rounded-full"></span>
                            About & Location
                        </h5>
                        <div class="space-y-6">
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">Address</label>
                                <textarea name="address" th:text="${user.address}" class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all outline-none" rows="2" placeholder="Alamat lengkap Anda..."></textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">Short Bio</label>
                                <textarea name="bio" th:text="${user.bio}" class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all outline-none" rows="4" placeholder="Ceritakan sedikit tentang Anda..."></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="p-8 bg-slate-50 flex flex-col sm:flex-row justify-end gap-3">
                        <a th:href="@{/profile}" class="px-8 py-4 bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 font-bold rounded-2xl transition-all text-center">
                            Batal
                        </a>
                        <button type="submit" class="px-8 py-4 bg-primary-600 hover:bg-primary-700 text-white font-bold rounded-2xl shadow-lg shadow-primary-200 transition-all flex items-center justify-center gap-2">
                            Simpan Perubahan <i class="bi bi-check2"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>

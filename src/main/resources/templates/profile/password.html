<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::div})}">
<head>
    <title>Change Password</title>
</head>
<body>
    <div class="content">
        <h2 class="mb-4">Change Password</h2>

        <div class="card col-md-6">
            <div class="card-body">
                <form th:action="@{/profile/password}" method="post">
                    <div class="mb-3">
                        <label class="form-label">New Password</label>
                        <input type="password" name="newPassword" id="newPassword" class="form-control" required minlength="4">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm New Password</label>
                        <input type="password" id="confirmPassword" class="form-control" required minlength="4">
                        <div id="passwordError" class="text-danger small mt-1" style="display:none;">Passwords do not match!</div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning" id="submitBtn">Update Password</button>
                        <a th:href="@{/profile}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const pass = document.getElementById('newPassword');
        const confirm = document.getElementById('confirmPassword');
        const error = document.getElementById('passwordError');
        const btn = document.getElementById('submitBtn');

        function validate() {
            if (pass.value && confirm.value && pass.value !== confirm.value) {
                error.style.display = 'block';
                btn.disabled = true;
            } else {
                error.style.display = 'none';
                btn.disabled = false;
            }
        }

        pass.addEventListener('input', validate);
        confirm.addEventListener('input', validate);
    </script>
</body>
</html>

<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::.content})}">
<head>
    <title>Change Password</title>
</head>
<body>
    <div class="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold"><i class="bi bi-shield-lock me-2"></i>Change Password</h2>
            <a th:href="@{/profile}" class="btn btn-outline-secondary shadow-sm">
                <i class="bi bi-arrow-left me-2"></i>Back to Profile
            </a>
        </div>

        <div class="row">
            <div class="col-lg-6 mx-auto">
                <div class="card border-0 shadow-sm p-4">
                    <p class="text-muted mb-4 small">Ensure your account is using a long, random password to stay secure.</p>
                    
                    <form th:action="@{/profile/password}" method="post">
                        <div class="mb-4">
                            <label class="form-label small fw-bold">New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-key text-muted"></i></span>
                                <input type="password" name="newPassword" id="newPassword" class="form-control border-start-0" required minlength="4" placeholder="Enter new password">
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label small fw-bold">Confirm New Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
                                <input type="password" id="confirmPassword" class="form-control border-start-0" required minlength="4" placeholder="Repeat new password">
                            </div>
                            <div id="passwordError" class="alert alert-danger mt-3 p-2 small" style="display:none;">
                                <i class="bi bi-exclamation-triangle-fill me-2"></i>Passwords do not match!
                            </div>
                        </div>

                        <div class="mt-5 d-flex justify-content-end gap-2">
                            <button type="submit" class="btn btn-warning px-4 shadow-sm fw-bold" id="submitBtn">
                                <i class="bi bi-check2-circle me-2"></i>Update Password
                            </button>
                            <a th:href="@{/profile}" class="btn btn-light px-4">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        const pass = document.getElementById('newPassword');
        const confirm = document.getElementById('confirmPassword');
        const error = document.getElementById('passwordError');
        const btn = document.getElementById('submitBtn');

        function validate() {
            if (pass.value && confirm.value && pass.value !== confirm.value) {
                error.style.display = 'block';
                btn.disabled = true;
            } else {
                error.style.display = 'none';
                btn.disabled = false;
            }
        }

        pass.addEventListener('input', validate);
        confirm.addEventListener('input', validate);
    </script>
</body>
</html>

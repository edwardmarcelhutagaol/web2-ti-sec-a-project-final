<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::.content})}">
<head>
    <title>Change Password - Inventory Pro</title>
</head>
<body>
    <div class="content">
        <div class="max-w-2xl mx-auto">
            <div class="flex items-center gap-4 mb-8">
                <a th:href="@{/profile}" class="flex items-center justify-center w-12 h-12 bg-white border border-slate-200 rounded-2xl text-slate-500 hover:text-primary-600 hover:border-primary-200 transition-all shadow-sm">
                    <i class="bi bi-arrow-left text-xl"></i>
                </a>
                <div>
                    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Change Password</h1>
                    <p class="text-slate-500">Pastikan akun Anda aman dengan menggunakan password yang kuat.</p>
                </div>
            </div>

            <div class="bg-white rounded-[2.5rem] shadow-sm border border-slate-100 p-8 md:p-10">
                <form th:action="@{/profile/password}" method="post" class="space-y-6">
                    <!-- Global Error -->
                    <div th:if="${error}" class="p-4 bg-red-50 border border-red-100 rounded-2xl flex items-center gap-3 text-red-600 text-sm font-bold shadow-sm">
                        <i class="bi bi-exclamation-circle-fill text-lg"></i>
                        <span th:text="${error}">Error message</span>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Password Lama</label>
                        <div class="relative group">
                            <i class="bi bi-shield-lock absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary-600 transition-colors"></i>
                            <input type="password" name="oldPassword" class="w-full pl-12 pr-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all outline-none" required placeholder="Masukkan password saat ini">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Password Baru</label>
                        <div class="relative group">
                            <i class="bi bi-key absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary-600 transition-colors"></i>
                            <input type="password" name="newPassword" id="newPassword" class="w-full pl-12 pr-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all outline-none" required minlength="4" placeholder="Masukkan password baru">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Konfirmasi Password Baru</label>
                        <div class="relative group">
                            <i class="bi bi-shield-check absolute left-5 top-1/2 -translate-y-1/2 text-slate-400 group-focus-within:text-primary-600 transition-colors"></i>
                            <input type="password" name="confirmPassword" id="confirmPassword" class="w-full pl-12 pr-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all outline-none" required minlength="4" placeholder="Ulangi password baru">
                        </div>
                        <div id="passwordError" class="mt-3 p-3 bg-red-50 border border-red-100 rounded-xl flex items-center gap-2 text-red-600 text-[11px] font-bold" style="display:none;">
                            <i class="bi bi-exclamation-triangle-fill"></i> Password baru dan konfirmasi tidak sama!
                        </div>
                    </div>

                    <div class="pt-6 border-t border-slate-100 flex flex-col sm:flex-row justify-end gap-3">
                        <a th:href="@{/profile}" class="px-8 py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-2xl transition-all text-center">
                            Batal
                        </a>
                        <button type="submit" class="px-8 py-4 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-2xl shadow-lg shadow-amber-200 transition-all flex items-center justify-center gap-2" id="submitBtn">
                            Update Password <i class="bi bi-check2-circle"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const pass = document.getElementById('newPassword');
        const confirm = document.getElementById('confirmPassword');
        const error = document.getElementById('passwordError');
        const btn = document.getElementById('submitBtn');

        function validate() {
            if (pass.value && confirm.value && pass.value !== confirm.value) {
                error.style.display = 'flex';
                btn.disabled = true;
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                error.style.display = 'none';
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        pass.addEventListener('input', validate);
        confirm.addEventListener('input', validate);
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Inventory System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .register-card { width: 100%; max-width: 450px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: white; }
    </style>
</head>
<body>
    <div class="register-card text-center">
        <h2 class="mb-4">Create Account</h2>
        <h5 class="text-muted mb-4">Join Inventory System</h5>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="form-floating mb-3 text-start">
                <input type="text" th:field="*{username}" name="username" class="form-control" id="username" placeholder="Username" required>
                <label for="username">Username</label>
            </div>
            <div class="form-floating mb-3 text-start">
                <input type="text" th:field="*{fullName}" name="fullName" class="form-control" id="fullName" placeholder="Full Name" required>
                <label for="fullName">Full Name</label>
            </div>
            <div class="form-floating mb-3 text-start">
                <input type="password" th:field="*{password}" name="password" class="form-control" id="password" placeholder="Password" required minlength="4">
                <label for="password">Password</label>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 mb-3">Register</button>
            <p class="mb-0">Already have an account? <a th:href="@{/login}">Login here</a></p>
        </form>
    </div>
</body>
</html>

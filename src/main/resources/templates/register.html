<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Inventory System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .register-card { width: 100%; max-width: 450px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: white; }
    </style>
</head>
<body>
    <div class="register-card shadow-lg border-0">
        <div class="mb-4">
            <h2 class="fw-bold text-primary">Create Account</h2>
            <p class="text-muted">Join the Inventory Management System</p>
        </div>

        <form th:action="@{/register}" th:object="${user}" method="post">
            <div class="mb-3 text-start">
                <label for="username" class="form-label small fw-bold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-at text-muted"></i></span>
                    <input type="text" th:field="*{username}" class="form-control border-start-0" id="username" placeholder="Choose a username" required>
                </div>
            </div>
            
            <div class="mb-3 text-start">
                <label for="fullName" class="form-label small fw-bold">Full Name <span class="text-muted fw-normal">(Optional)</span></label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" th:field="*{fullName}" class="form-control border-start-0" id="fullName" placeholder="Enter your full name">
                </div>
            </div>

            <div class="mb-3 text-start">
                <label for="email" class="form-label small fw-bold">Email Address <span class="text-muted fw-normal">(Optional)</span></label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" th:field="*{email}" class="form-control border-start-0" id="email" placeholder="example@domain.com">
                </div>
            </div>

            <div class="mb-4 text-start">
                <label for="password" class="form-label small fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-shield-lock text-muted"></i></span>
                    <input type="password" th:field="*{password}" class="form-control border-start-0" id="password" placeholder="Create a strong password" required minlength="4">
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow-sm mb-3">
                <i class="bi bi-person-plus me-2"></i>Get Started
            </button>
            
            <p class="mb-0 small text-muted">
                Already have an account? <a th:href="@{/login}" class="text-primary fw-bold text-decoration-none">Login here</a>
            </p>
        </form>
    </div>
</body>
</html>

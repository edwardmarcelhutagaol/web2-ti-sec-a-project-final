<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::.content})}">
<head>
    <title>Products - Inventory System</title>
</head>
<body>
    <div class="content">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Products</h1>
                <p class="text-slate-500">Kelola semua stok barang di inventory Anda.</p>
            </div>
            <a th:href="@{/products/add}" class="inline-flex items-center gap-2 px-6 py-3 bg-primary-600 hover:bg-primary-700 text-white font-bold rounded-2xl shadow-lg shadow-primary-200 transition-all">
                <i class="bi bi-plus-lg"></i> Tambah Produk
            </a>
        </div>

        <!-- Search & Filter -->
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 mb-8">
            <form th:action="@{/products}" method="get" class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end">
                <div class="md:col-span-5">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Cari Produk</label>
                    <div class="relative">
                        <i class="bi bi-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" name="search" th:value="${search}" class="w-full pl-11 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all outline-none" placeholder="Masukkan nama produk...">
                    </div>
                </div>
                <div class="md:col-span-4">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2 ml-1">Kategori</label>
                    <select name="categoryId" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all outline-none appearance-none">
                        <option value="">Semua Kategori</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == categoryId}"></option>
                    </select>
                </div>
                <div class="md:col-span-3 flex gap-2">
                    <button type="submit" class="flex-1 px-4 py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-2xl transition-colors">
                        Filter
                    </button>
                    <a th:href="@{/products}" class="px-4 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-2xl transition-colors">
                        Reset
                    </a>
                </div>
            </form>
        </div>

        <div class="bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/50 border-b border-slate-100">
                            <th class="px-6 py-5 text-xs font-bold text-slate-400 uppercase tracking-wider">Info Produk</th>
                            <th class="px-6 py-5 text-xs font-bold text-slate-400 uppercase tracking-wider">Kategori</th>
                            <th class="px-6 py-5 text-xs font-bold text-slate-400 uppercase tracking-wider">Harga</th>
                            <th class="px-6 py-5 text-xs font-bold text-slate-400 uppercase tracking-wider text-center">Stok</th>
                            <th class="px-6 py-5 text-xs font-bold text-slate-400 uppercase tracking-wider text-center">Status</th>
                            <th class="px-6 py-5 text-xs font-bold text-slate-400 uppercase tracking-wider text-right">Aksi</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <tr th:each="p : ${products}" class="hover:bg-slate-50/80 transition-colors group">
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center text-slate-400 group-hover:bg-primary-50 group-hover:text-primary-600 transition-colors">
                                        <i class="bi bi-box"></i>
                                    </div>
                                    <span class="font-bold text-slate-900" th:text="${p.name}">Name</span>
                                </div>
                            </td>
                            <td class="px-6 py-4">
                                <span class="px-3 py-1 bg-slate-100 text-slate-600 text-xs font-bold rounded-lg" th:text="${p.category.name}">Category</span>
                            </td>
                            <td class="px-6 py-4 font-semibold text-slate-900" th:text="'Rp ' + ${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')}">Price</td>
                            <td class="px-6 py-4 text-center">
                                <span th:classappend="${p.stock < 5 ? 'text-red-600 font-bold' : 'text-slate-600 font-medium'}" th:text="${p.stock}">Stock</span>
                            </td>
                            <td class="px-6 py-4 text-center">
                                <span th:if="${p.active}" class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-700 text-xs font-bold">
                                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Aktif
                                </span>
                                <span th:unless="${p.active}" class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full bg-slate-100 text-slate-500 text-xs font-bold">
                                    <span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span> Non-aktif
                                </span>
                            </td>
                            <td class="px-6 py-4 text-right space-x-1">
                                <a th:href="@{/products/edit/{id}(id=${p.id})}" class="inline-flex items-center justify-center w-9 h-9 text-slate-400 hover:text-primary-600 hover:bg-primary-50 rounded-xl transition-all">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <a th:href="@{/products/delete/{id}(id=${p.id})}" class="inline-flex items-center justify-center w-9 h-9 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-xl transition-all" onclick="return confirm('Apakah Anda yakin ingin menghapus produk ini?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="6" class="px-6 py-20 text-center">
                                <div class="flex flex-col items-center opacity-40">
                                    <i class="bi bi-inbox text-5xl mb-3"></i>
                                    <p class="font-bold">Tidak ada produk ditemukan</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Info & Pagination -->
            <div class="px-6 py-6 bg-slate-50/50 border-t border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-4">
                <p class="text-sm text-slate-500 font-medium">
                    Menampilkan <span class="text-slate-900 font-bold" th:text="${products.size()}">0</span> dari 
                    <span class="text-slate-900 font-bold" th:text="${totalElements}">0</span> produk
                </p>
                
                <nav th:if="${totalPages > 1}">
                    <ul class="flex items-center gap-1">
                        <li>
                            <a th:href="@{/products(page=${currentPage - 1}, search=${search}, categoryId=${categoryId})}" 
                               th:classappend="${currentPage == 0 ? 'pointer-events-none opacity-50' : 'hover:bg-white hover:shadow-sm'}"
                               class="flex items-center justify-center w-10 h-10 rounded-xl text-slate-600 transition-all">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                            <a th:href="@{/products(page=${i}, search=${search}, categoryId=${categoryId})}" 
                               th:classappend="${currentPage == i ? 'bg-primary-600 text-white shadow-lg shadow-primary-200' : 'text-slate-600 hover:bg-white hover:shadow-sm'}"
                               class="flex items-center justify-center w-10 h-10 rounded-xl font-bold text-sm transition-all" 
                               th:text="${i + 1}">1</a>
                        </li>
                        <li>
                            <a th:href="@{/products(page=${currentPage + 1}, search=${search}, categoryId=${categoryId})}" 
                               th:classappend="${currentPage == totalPages - 1 ? 'pointer-events-none opacity-50' : 'hover:bg-white hover:shadow-sm'}"
                               class="flex items-center justify-center w-10 h-10 rounded-xl text-slate-600 transition-all">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::.content})}">
<head>
    <title>Products</title>
</head>
<body>
    <div class="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Products</h2>
            <a th:href="@{/products/add}" class="btn btn-primary">Add Product</a>
        </div>

        <!-- Search & Filter -->
        <div class="card mb-4">
            <div class="card-body">
                <form th:action="@{/products}" method="get" class="row g-3">
                    <div class="col-md-4">
                        <input type="text" name="search" th:value="${search}" class="form-control" placeholder="Search by name...">
                    </div>
                    <div class="col-md-4">
                        <select name="categoryId" class="form-select">
                            <option value="">All Categories</option>
                            <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == categoryId}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-secondary w-100">Search</button>
                    </div>
                    <div class="col-md-2">
                        <a th:href="@{/products}" class="btn btn-link w-100 text-decoration-none">Reset</a>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${products}">
                            <td th:text="${p.name}">Name</td>
                            <td th:text="${p.category.name}">Category</td>
                            <td th:text="'Rp ' + ${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')}">Price</td>
                            <td th:text="${p.stock}">Stock</td>
                            <td>
                                <span th:if="${p.active}" class="badge bg-success">Active</span>
                                <span th:unless="${p.active}" class="badge bg-secondary">Inactive</span>
                            </td>
                            <td>
                                <a th:href="@{/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                                <a th:href="@{/products/delete/{id}(id=${p.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure?')">Delete</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="6" class="text-center text-muted">No products found.</td>
                        </tr>
                    </tbody>
                </table>

                <!-- Pagination -->
                <nav th:if="${totalPages > 1}" class="mt-4">
                    <ul class="pagination justify-content-center">
                        <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                            <a class="page-item" th:href="@{/products(page=${currentPage - 1}, search=${search}, categoryId=${categoryId})}">Previous</a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}" class="page-item" th:classappend="${currentPage == i ? 'active' : ''}">
                            <a class="page-item" th:href="@{/products(page=${i}, search=${search}, categoryId=${categoryId})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                            <a class="page-item" th:href="@{/products(page=${currentPage + 1}, search=${search}, categoryId=${categoryId})}">Next</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</body>
</html>

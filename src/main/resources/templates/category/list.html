<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::.content})}">
<head>
    <title>Categories</title>
</head>
<body>
    <div class="content">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Categories</h2>
            <a th:href="@{/categories/add}" class="btn btn-primary">Add Category</a>
        </div>

        <div class="card">
            <div class="card-body">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Description</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${categories}">
                            <td th:text="${c.name}">Name</td>
                            <td th:text="${c.description}">Description</td>
                            <td>
                                <a th:href="@{/categories/edit/{id}(id=${c.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                                <a th:href="@{/categories/delete/{id}(id=${c.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure?')">Delete</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(categories)}">
                            <td colspan="3" class="text-center text-muted">No categories found.</td>
                        </tr>
                    </tbody>
                </table>
                <!-- Info & Pagination -->
                <div class="d-flex justify-content-between align-items-center mt-4">
                    <div class="text-muted small">
                        Showing <span class="fw-bold" th:text="${categories.size()}">0</span> of 
                        <span class="fw-bold" th:text="${totalElements}">0</span> categories
                    </div>
                    
                    <nav th:if="${totalPages > 1}">
                        <ul class="pagination mb-0">
                            <li class="page-item" th:classappend="${currentPage == 0 ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/categories(page=${currentPage - 1})}">
                                    <i class="bi bi-chevron-left"></i>
                                </a>
                            </li>
                            <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}" class="page-item" th:classappend="${currentPage == i ? 'active' : ''}">
                                <a class="page-link" th:href="@{/categories(page=${i})}" th:text="${i + 1}">1</a>
                            </li>
                            <li class="page-item" th:classappend="${currentPage == totalPages - 1 ? 'disabled' : ''}">
                                <a class="page-link" th:href="@{/categories(page=${currentPage + 1})}">
                                    <i class="bi bi-chevron-right"></i>
                                </a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

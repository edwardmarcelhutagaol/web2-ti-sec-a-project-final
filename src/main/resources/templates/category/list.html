<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::.content})}">
<head>
    <title>Categories - Inventory System</title>
</head>
<body>
    <div class="content">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">Categories</h1>
                <p class="text-slate-500">Kelola kategori untuk pengelompokan produk Anda.</p>
            </div>
            <a th:href="@{/categories/add}" class="inline-flex items-center gap-2 px-6 py-3 bg-primary-600 hover:bg-primary-700 text-white font-bold rounded-2xl shadow-lg shadow-primary-200 transition-all">
                <i class="bi bi-plus-lg"></i> Tambah Kategori
            </a>
        </div>

        <div class="bg-white rounded-[2rem] shadow-sm border border-slate-100 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50/50 border-b border-slate-100">
                            <th class="px-6 py-5 text-xs font-bold text-slate-400 uppercase tracking-wider">Nama Kategori</th>
                            <th class="px-6 py-5 text-xs font-bold text-slate-400 uppercase tracking-wider">Deskripsi</th>
                            <th class="px-6 py-5 text-xs font-bold text-slate-400 uppercase tracking-wider text-right">Aksi</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-100">
                        <tr th:each="c : ${categories}" class="hover:bg-slate-50/80 transition-colors group">
                            <td class="px-6 py-4">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center text-slate-400 group-hover:bg-primary-50 group-hover:text-primary-600 transition-colors">
                                        <i class="bi bi-folder2"></i>
                                    </div>
                                    <span class="font-bold text-slate-900" th:text="${c.name}">Name</span>
                                </div>
                            </td>
                            <td class="px-6 py-4">
                                <p class="text-sm text-slate-500 line-clamp-1" th:text="${c.description ?: '-'}">Description</p>
                            </td>
                            <td class="px-6 py-4 text-right space-x-1">
                                <a th:href="@{/categories/edit/{id}(id=${c.id})}" class="inline-flex items-center justify-center w-9 h-9 text-slate-400 hover:text-primary-600 hover:bg-primary-50 rounded-xl transition-all">
                                    <i class="bi bi-pencil-square"></i>
                                </a>
                                <a th:href="@{/categories/delete/{id}(id=${c.id})}" class="inline-flex items-center justify-center w-9 h-9 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-xl transition-all" onclick="return confirm('Apakah Anda yakin ingin menghapus kategori ini? Semua produk dalam kategori ini mungkin akan terpengaruh.')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(categories)}">
                            <td colspan="3" class="px-6 py-20 text-center">
                                <div class="flex flex-col items-center opacity-40">
                                    <i class="bi bi-tags text-5xl mb-3"></i>
                                    <p class="font-bold">Belum ada kategori</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Info & Pagination -->
            <div class="px-6 py-6 bg-slate-50/50 border-t border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-4">
                <p class="text-sm text-slate-500 font-medium">
                    Menampilkan <span class="text-slate-900 font-bold" th:text="${categories.size()}">0</span> dari 
                    <span class="text-slate-900 font-bold" th:text="${totalElements}">0</span> kategori
                </p>
                
                <nav th:if="${totalPages > 1}">
                    <ul class="flex items-center gap-1">
                        <li>
                            <a th:href="@{/categories(page=${currentPage - 1})}" 
                               th:classappend="${currentPage == 0 ? 'pointer-events-none opacity-50' : 'hover:bg-white hover:shadow-sm'}"
                               class="flex items-center justify-center w-10 h-10 rounded-xl text-slate-600 transition-all">
                                <i class="bi bi-chevron-left"></i>
                            </a>
                        </li>
                        <li th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                            <a th:href="@{/categories(page=${i})}" 
                               th:classappend="${currentPage == i ? 'bg-primary-600 text-white shadow-lg shadow-primary-200' : 'text-slate-600 hover:bg-white hover:shadow-sm'}"
                               class="flex items-center justify-center w-10 h-10 rounded-xl font-bold text-sm transition-all" 
                               th:text="${i + 1}">1</a>
                        </li>
                        <li>
                            <a th:href="@{/categories(page=${currentPage + 1})}" 
                               th:classappend="${currentPage == totalPages - 1 ? 'pointer-events-none opacity-50' : 'hover:bg-white hover:shadow-sm'}"
                               class="flex items-center justify-center w-10 h-10 rounded-xl text-slate-600 transition-all">
                                <i class="bi bi-chevron-right"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </div>
</body>
</html>

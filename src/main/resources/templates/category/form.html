<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::.content})}">
<head>
    <title th:text="${category.id == null ? 'Tambah Kategori' : 'Edit Kategori'} + ' - Inventory System'"></title>
</head>
<body>
    <div class="content">
        <div class="max-w-2xl mx-auto">
            <div class="flex items-center gap-4 mb-8">
                <a th:href="@{/categories}" class="flex items-center justify-center w-12 h-12 bg-white border border-slate-200 rounded-2xl text-slate-500 hover:text-primary-600 hover:border-primary-200 transition-all shadow-sm">
                    <i class="bi bi-arrow-left text-xl"></i>
                </a>
                <div>
                    <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight" th:text="${category.id == null ? 'Tambah Kategori' : 'Edit Kategori'}">Form Kategori</h1>
                    <p class="text-slate-500">Berikan nama dan deskripsi untuk kategori baru.</p>
                </div>
            </div>

            <div class="bg-white rounded-[2rem] shadow-sm border border-slate-100 p-8 md:p-10">
                <form th:action="@{/categories/save}" th:object="${category}" method="post" class="space-y-6">
                    <input type="hidden" th:field="*{id}">
                    
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">Nama Kategori</label>
                        <input type="text" th:field="*{name}" class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all outline-none" placeholder="Contoh: Elektronik, Pakaian, dll" required>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2 ml-1">Deskripsi</label>
                        <textarea th:field="*{description}" class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition-all outline-none" rows="4" placeholder="Jelaskan kategori ini secara singkat..."></textarea>
                    </div>

                    <div class="pt-6 border-t border-slate-100 flex flex-col sm:flex-row justify-end gap-3">
                        <a th:href="@{/categories}" class="px-8 py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-2xl transition-all text-center">
                            Batal
                        </a>
                        <button type="submit" class="px-8 py-4 bg-primary-600 hover:bg-primary-700 text-white font-bold rounded-2xl shadow-lg shadow-primary-200 transition-all flex items-center justify-center gap-2">
                            <i class="bi bi-check2-circle text-xl"></i> Simpan Kategori
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>

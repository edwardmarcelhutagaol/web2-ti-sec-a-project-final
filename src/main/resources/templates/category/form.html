<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::.content})}">
<head>
    <title th:text="${category.id == null ? 'Add Category' : 'Edit Category'}"></title>
</head>
<body>
    <div class="content">
        <h2 class="mb-4" th:text="${category.id == null ? 'Add Category' : 'Edit Category'}"></h2>

        <div class="card col-md-6">
            <div class="card-body">
                <form th:action="@{/categories/save}" th:object="${category}" method="post">
                    <input type="hidden" th:field="*{id}">
                    
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" th:field="*{name}" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Category</button>
                        <a th:href="@{/categories}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>

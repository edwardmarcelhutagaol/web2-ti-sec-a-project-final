<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Inventory System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Bootstrap Icons (keep for consistency) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f5f3ff', 100: '#ede9fe', 200: '#ddd6fe', 300: '#c4b5fd', 
                            400: '#a78bfa', 500: '#8b5cf6', 600: '#7c3aed', 700: '#6d28d9', 
                            800: '#5b21b6', 900: '#4c1d95',
                        },
                        slate: {
                            50: '#f8fafc', 100: '#f1f5f9', 200: '#e2e8f0', 300: '#cbd5e1', 
                            400: '#94a3b8', 500: '#64748b', 600: '#475569', 700: '#334155', 
                            800: '#1e293b', 900: '#0f172a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800" x-data="{ sidebarOpen: false }">
    <div class="min-h-screen flex flex-col">
        <!-- Navbar -->
        <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
            <div class="container mx-auto px-4 h-16 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <button @click="sidebarOpen = !sidebarOpen" class="lg:hidden p-2 rounded-lg hover:bg-slate-100 transition-colors">
                        <i class="bi bi-list text-2xl"></i>
                    </button>
                    <a th:href="@{/}" class="flex items-center gap-2 text-xl font-bold text-slate-900 tracking-tight">
                        <div class="w-10 h-10 bg-primary-600 rounded-xl flex items-center justify-center text-white shadow-lg shadow-primary-200">
                            <i class="bi bi-box-seam"></i>
                        </div>
                        <span class="hidden sm:inline">Inventory <span class="text-primary-600">Pro</span></span>
                    </a>
                </div>

                <div class="flex items-center gap-4">
                    <div class="relative" x-data="{ open: false }">
                        <button @click="open = !open" @click.away="open = false" class="flex items-center gap-3 p-1.5 rounded-full hover:bg-slate-100 transition-all">
                            <div class="w-9 h-9 bg-slate-200 rounded-full flex items-center justify-center overflow-hidden">
                                <i class="bi bi-person-fill text-slate-500"></i>
                            </div>
                            <span class="hidden md:block font-medium text-sm text-slate-700" sec:authentication="name">Username</span>
                            <i class="bi bi-chevron-down text-xs text-slate-400 mr-2"></i>
                        </button>
                        
                        <!-- Dropdown menu -->
                        <div x-show="open" 
                             x-transition:enter="transition ease-out duration-100"
                             x-transition:enter-start="transform opacity-0 scale-95"
                             x-transition:enter-end="transform opacity-100 scale-100"
                             x-transition:leave="transition ease-in duration-75"
                             x-transition:leave-start="transform opacity-100 scale-100"
                             x-transition:leave-end="transform opacity-0 scale-95"
                             class="absolute right-0 mt-2 w-56 bg-white border border-slate-200 rounded-2xl shadow-xl py-2 z-50" x-cloak>
                            <a th:href="@{/profile}" class="flex items-center gap-3 px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">
                                <i class="bi bi-person text-lg text-slate-400"></i> My Profile
                            </a>
                            <a th:href="@{/profile/edit}" class="flex items-center gap-3 px-4 py-2 text-sm text-slate-700 hover:bg-slate-50">
                                <i class="bi bi-pencil text-lg text-slate-400"></i> Edit Profile
                            </a>
                            <div class="my-1 border-t border-slate-100"></div>
                            <form th:action="@{/logout}" method="post" class="block">
                                <button type="submit" class="w-full flex items-center gap-3 px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">
                                    <i class="bi bi-box-arrow-right text-lg"></i> Logout
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <div class="flex-1 flex overflow-hidden">
            <!-- Sidebar -->
            <aside :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'" 
                   class="fixed inset-y-0 left-0 lg:static lg:block w-64 bg-slate-900 text-slate-300 transform transition-transform duration-300 ease-in-out z-40">
                <div class="h-full flex flex-col p-4">
                    <nav class="flex-1 space-y-1">
                        <a th:href="@{/}" th:classappend="${#httpServletRequest.requestURI == '/' ? 'bg-primary-600 text-white shadow-lg shadow-primary-900/50' : 'hover:bg-slate-800 hover:text-white'}" 
                           class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-medium">
                            <i class="bi bi-speedometer2 text-xl"></i> Dashboard
                        </a>
                        <a th:href="@{/categories}" th:classappend="${#httpServletRequest.requestURI.startsWith('/categories') ? 'bg-primary-600 text-white shadow-lg shadow-primary-900/50' : 'hover:bg-slate-800 hover:text-white'}" 
                           class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-medium">
                            <i class="bi bi-tags text-xl"></i> Categories
                        </a>
                        <a th:href="@{/products}" th:classappend="${#httpServletRequest.requestURI.startsWith('/products') ? 'bg-primary-600 text-white shadow-lg shadow-primary-900/50' : 'hover:bg-slate-800 hover:text-white'}" 
                           class="flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-medium">
                            <i class="bi bi-box-seam text-xl"></i> Products
                        </a>
                    </nav>

                    <div class="pt-4 border-t border-slate-800">
                        <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider px-4 mb-2">Account Management</p>
                        <a th:href="@{/profile/password}" class="flex items-center gap-3 px-4 py-2 rounded-lg hover:bg-slate-800 hover:text-white transition-colors text-sm">
                            <i class="bi bi-shield-lock"></i> Security Settings
                        </a>
                    </div>
                </div>
            </aside>

            <!-- Main Content Area -->
            <main class="flex-1 overflow-y-auto p-4 md:p-8 lg:p-10">
                <div th:replace="${content} ?: ~{}"></div>
            </main>
        </div>

        <!-- Overlay for mobile sidebar -->
        <div x-show="sidebarOpen" 
             @click="sidebarOpen = false"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0"
             x-transition:enter-end="opacity-100"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="opacity-100"
             x-transition:leave-end="opacity-0"
             class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-30 lg:hidden" x-cloak></div>
    </div>
</body>
</html>

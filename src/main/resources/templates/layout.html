<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(title, content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Inventory System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
            --sidebar-bg: #0f172a;
            --main-bg: #f8fafc;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--main-bg);
            color: #1e293b;
        }
        .sidebar { 
            min-height: 100vh; 
            background: var(--sidebar-bg); 
            color: white; 
            box-shadow: 4px 0 10px rgba(0,0,0,0.05);
        }
        .sidebar a { 
            color: #94a3b8; 
            text-decoration: none; 
            padding: 12px 24px; 
            display: flex; 
            align-items: center;
            transition: all 0.2s;
            border-radius: 8px;
            margin: 4px 12px;
        }
        .sidebar a:hover { 
            color: white; 
            background: rgba(255,255,255,0.05); 
        }
        .sidebar a.active { 
            color: white; 
            background: var(--primary-gradient);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }
        .card { 
            border: none; 
            border-radius: 16px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); 
        }
        .navbar {
            background: white !important;
            border-bottom: 1px solid #e2e8f0;
        }
        .navbar-brand {
            color: #0f172a !important;
        }
        .nav-link {
            color: #64748b !important;
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
            <div class="container-fluid px-4">
                <a class="navbar-brand fw-bold" th:href="@{/}">
                    <i class="bi bi-box-seam me-2"></i>Inventory System
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarContent">
                    <ul class="navbar-nav ms-auto align-items-center">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                <div class="bg-secondary rounded-circle me-2 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                                    <i class="bi bi-person-fill text-white"></i>
                                </div>
                                <span sec:authentication="name">Username</span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2" aria-labelledby="userDropdown">
                                <li><a class="dropdown-item py-2" th:href="@{/profile}"><i class="bi bi-person me-2"></i>My Profile</a></li>
                                <li><a class="dropdown-item py-2" th:href="@{/profile/edit}"><i class="bi bi-pencil me-2"></i>Edit Profile</a></li>
                                <li><a class="dropdown-item py-2" th:href="@{/profile/password}"><i class="bi bi-shield-lock me-2"></i>Change Password</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li>
                                    <form th:action="@{/logout}" method="post" class="m-0">
                                        <button type="submit" class="dropdown-item py-2 text-danger">
                                            <i class="bi bi-box-arrow-right me-2"></i>Logout
                                        </button>
                                    </form>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="row g-0">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-0">
                <div class="mt-3">
                    <a th:href="@{/}">
                        <i class="bi bi-speedometer2 me-2"></i> Dashboard
                    </a>
                    <a th:href="@{/categories}">
                        <i class="bi bi-tags me-2"></i> Categories
                    </a>
                    <a th:href="@{/products}">
                        <i class="bi bi-box-seam me-2"></i> Products
                    </a>
                </div>
            </nav>

            <!-- Main Content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div th:replace="${content} ?: ~{}"></div>
            </main>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const currentPath = window.location.pathname;
            document.querySelectorAll('.sidebar a').forEach(link => {
                const href = link.getAttribute('href');
                if (href === currentPath || (currentPath.startsWith(href) && href !== '/')) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - Inventory System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .login-card { width: 100%; max-width: 400px; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); background: white; }
    </style>
</head>
<body>
    <div class="login-card shadow-lg border-0">
        <div class="mb-4">
            <h2 class="fw-bold text-primary">Welcome Back</h2>
            <p class="text-muted">Please sign in to your account</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger p-2 small mb-4">
            <i class="bi bi-exclamation-circle me-2"></i>Invalid username or password.
        </div>
        <div th:if="${param.logout}" class="alert alert-info p-2 small mb-4">
            <i class="bi bi-info-circle me-2"></i>You have been logged out.
        </div>
        <div th:if="${success}" class="alert alert-success p-2 small mb-4" th:text="${success}"></div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3 text-start">
                <label for="username" class="form-label small fw-bold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" name="username" class="form-control border-start-0" id="username" placeholder="Enter your username" required>
                </div>
            </div>
            
            <div class="mb-4 text-start">
                <label for="password" class="form-label small fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-shield-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0" id="password" placeholder="Enter your password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow-sm mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
            </button>
            
            <p class="mb-0 small text-muted">
                Don't have an account? <a th:href="@{/register}" class="text-primary fw-bold text-decoration-none">Register here</a>
            </p>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::div})}">
<head>
    <title>My Profile</title>
</head>
<body>
    <div class="content">
        <h2 class="mb-4">User Profile</h2>

        <div th:if="${param.success}" class="alert alert-success">Profile updated successfully!</div>
        <div th:if="${param.passwordSuccess}" class="alert alert-success">Password changed successfully!</div>

        <div class="row g-4">
            <div class="col-md-6">
                <div class="card p-4">
                    <h5>Profile Information</h5>
                    <form th:action="@{/profile/update}" method="post">
                        <input type="hidden" name="id" th:value="${user.id}">
                        <div class="mb-3">
                            <label class="form-label">Username</label>
                            <input type="text" th:value="${user.username}" class="form-control" readonly disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <input type="text" name="fullName" th:value="${user.fullName}" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Update Profile</button>
                    </form>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card p-4 h-100 d-flex flex-column justify-content-center align-items-center text-center">
                    <i class="bi bi-shield-lock mb-3" style="font-size: 3rem;"></i>
                    <h5>Account Security</h5>
                    <p class="text-muted">Keep your account safe by updating your password regularly.</p>
                    <a th:href="@{/profile/password}" class="btn btn-warning">Change Password</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

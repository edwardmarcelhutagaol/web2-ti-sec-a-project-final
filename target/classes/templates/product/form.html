<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::div})}">
<head>
    <title th:text="${product.id == null ? 'Add Product' : 'Edit Product'}"></title>
</head>
<body>
    <div class="content">
        <h2 class="mb-4" th:text="${product.id == null ? 'Add Product' : 'Edit Product'}"></h2>

        <div class="card col-md-8">
            <div class="card-body">
                <form th:action="@{/products/save}" th:object="${product}" method="post">
                    <input type="hidden" th:field="*{id}">
                    
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Product Name</label>
                            <input type="text" th:field="*{name}" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <select th:field="*{category.id}" class="form-select" required>
                                <option value="">Select Category</option>
                                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">Price (Rp)</label>
                            <input type="number" th:field="*{price}" class="form-control" step="0.01" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Stock</label>
                            <input type="number" th:field="*{stock}" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" th:field="*{active}" id="active">
                            <label class="form-check-label" for="active">Active Product</label>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Product</button>
                        <a th:href="@{/products}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
